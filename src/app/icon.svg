<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <!-- Optic lens circle -->
  <circle cx="28" cy="28" r="18" fill="none" stroke="#f4c430" stroke-width="4.5"/>
  <!-- Lens handle -->
  <line x1="41" y1="41" x2="54" y2="54" stroke="#f4c430" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Query scan lines inside lens -->
  <line x1="18" y1="24" x2="38" y2="24" stroke="#f4f4f5" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="33" y2="32" stroke="#a1a1aa" stroke-width="3.2" stroke-linecap="round"/>
</svg>
