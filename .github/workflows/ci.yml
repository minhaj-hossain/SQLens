name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Unit & engine tests (Vitest)
        run: npm test

      - name: Engine regression suite
        run: npm run test:engine

      - name: Module order & identity regression
        run: npm run test:module-order

      - name: DB lifecycle regression
        run: npm run test:db-lifecycle

      - name: Curriculum content verification
        run: npm run verify:curriculum

      - name: Full task audit
        run: npx tsx scripts/audit-all-tasks.ts

      - name: Engine equivalence probes (S1/S2 contracts)
        run: npm run audit:equivalence

      - name: Task equivalence guardrail (approach-fairness)
        run: npm run audit:equivalence:tasks

      - name: Validation-overlap census
        run: npm run audit:validation-overlap

      - name: Keyword case-fragility guardrail
        run: npm run audit:keyword-case

      - name: Grading-pipeline audit (real UI pipeline over every task)
        run: npm run audit:grading-pipeline

      - name: Grading-policy enforcement
        run: npm run audit:grading-policy

      - name: Taught-before-tested (constructs taught before use, values visible)
        run: npm run audit:taught-before-tested

      - name: Custom-validator audit (predicates reachable, refutable, explainable)
        run: npm run audit:custom-validators

      - name: DDL contract audit (prompt visibility + requiredColumns)
        run: npm run audit:ddl-contracts

      - name: Production build
        run: npm run build
