name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Unit & engine tests (Vitest)
        run: npm test

      - name: Engine regression suite
        run: npm run test:engine

      - name: Module order & identity regression
        run: npm run test:module-order

      - name: DB lifecycle regression
        run: npm run test:db-lifecycle

      - name: Curriculum content verification
        run: npm run verify:curriculum

      - name: Full task audit
        run: npx tsx scripts/audit-all-tasks.ts

      - name: Production build
        run: npm run build
